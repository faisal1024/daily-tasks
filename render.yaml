# Render blueprint for the Momentum AI proxy.
# The proxy is a dependency-free Node HTTP server, so no install/build is needed.
# Deploy: render.com → New → Blueprint → connect this repo → set ANTHROPIC_API_KEY.
services:
  - type: web
    name: momentum-ai-proxy
    runtime: node
    plan: free
    # The proxy is intentionally dependency-free (Node builtins + global fetch),
    # so we skip install entirely. If the proxy ever gains a runtime npm
    # dependency, change this to install it (e.g. give server/ its own
    # package.json and run `npm ci` there) — otherwise the deploy will fail at
    # runtime with a module-not-found.
    buildCommand: "echo no build needed"
    startCommand: node server/momentum-proxy.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MOMENTUM_AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      # Set this in the Render dashboard (secret) — never commit a key.
      - key: ANTHROPIC_API_KEY
        sync: false
      # CORS_ORIGIN is intentionally unset: the native app doesn't need CORS,
      # and no browser client exists. Set it only if a web client is added.
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      # Cost protection: per-client and global daily request caps. 500 Haiku
      # calls is roughly $2/day worst case, so one bad day can't use the whole
      # monthly budget. 0 disables a cap.
      - key: DAILY_LIMIT_PER_CLIENT
        value: "40"
      - key: GLOBAL_DAILY_LIMIT
        value: "500"
      # Render sits one proxy hop in front of the app; the client IP is the last
      # X-Forwarded-For entry, which clients cannot spoof. VERIFY once after deploy
      # with DEBUG_CLIENT_IP=1 (see docs/momentum-ai-proxy.md), then remove it.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Required in production: set the same random value here (dashboard secret)
      # AND as the EAS env var EXPO_PUBLIC_MOMENTUM_PROXY_SECRET.
      - key: PROXY_SHARED_SECRET
        sync: false
      # Start in "log" (old builds without the header still work, and are logged);
      # switch to "enforce" once most active users run a build that sends it.
      - key: SECRET_MODE
        value: log
      # Server-side Plus check (RevenueCat REST). "off" until the paywall is
      # live; then "log" to measure, then "enforce". Needs REVENUECAT_SECRET_KEY.
      - key: ENTITLEMENT_MODE
        value: "off"
      - key: REVENUECAT_SECRET_KEY
        sync: false
      # Ceiling on a free user's AI brain dumps per day (0 = none).
      - key: FREE_BRAIN_DUMPS_PER_DAY
        value: "8"
      # Early supporters can claim lifetime Plus until this date (YYYY-MM-DD).
      - key: GRANDFATHER_GRANTS_UNTIL
        sync: false
