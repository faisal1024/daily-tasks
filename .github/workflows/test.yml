name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json (pnpm 9).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (app + UI tests)
        run: npm run check

      - name: Lint
        run: npx eslint server lib components app tests

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: UI tests (Jest)
        run: npx jest --ci

  # Day keys, midnight rollover and auto-lock all use the device's local time.
  # CI runs in UTC, so repeat the suites east and west of it (Kiritimati is
  # UTC+14, where "T00:00Z" is already the afternoon; Pago Pago is UTC-11).
  timezones:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Kolkata, America/New_York, Pacific/Kiritimati, Pacific/Pago_Pago]
    env:
      TZ: ${{ matrix.tz }}
    name: tests (${{ matrix.tz }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the time zone is applied
        run: node -e "const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if (tz !== process.env.TZ) { console.error('Expected ' + process.env.TZ + ', got ' + tz); process.exit(1) }"

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: UI tests (Jest)
        run: npx jest --ci
